# The app linted, unit-tested and built, debug and release, on every push and pull request: on
# Forgejo's runner and on GitHub alike. The runner gets a JDK and the Android SDK's command-line
# tools, with the SDK's licences accepted; the build fetches the platform and build tools it names.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Lint, test and build
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleDebug bundleRelease
